<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ɔhess</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div id="UI">
    <h1>Ɔhess</h1>

        <div class="mainButtons">
            <button id="start" class="btn" onclick="startGame()">▶️ スタート</button>
            <button id="rule" class="btn" onclick="rulebook()">ルール</button>
        </div>
        <div class="subButtons">
            <button id="setting" class="btn" onclick="setting()">カラーモード変更</button>
        </div>
    </div>
    <div id="game" style="
        display:flex;
        justify-content:center;
        width:100%;">
        <div id="container" hidden="true" style="position:relative;">
            <div id="board">
                <div id="grid"></div>
                <canvas id="can" style="position:absolute;top:0;left:0;"></canvas>
            </div>
            <p id="onlineGameStatus" hidden></p>
            <p id="onlineConnectionStatus" hidden>接続状態を確認しています…</p>
            <button id="rematchOnlineButton" class="btn" hidden>もう一度対局</button>
            <button id="backToMenuButton" class="btn" hidden>メニューに戻る</button>
            <div id="sentaku" style="text-align:center;" hidden="true">
                <button onclick="choosePiece('Q')"><img src="0_queen.png" alt="Queen"></button>
                <button onclick="choosePiece('R')"><img src="0_rook.png" alt="Rook"></button>
                <button onclick="choosePiece('B')"><img src="0_bishop.png" alt="Bishop"></button>
                <button onclick="choosePiece('N')"><img src="0_knight.png" alt="Knight"></button>
            </div>
        </div>
    </div>
    <div id="modePanel" class="panel" hidden="true">
        <div class="panelContent">
            <h3 class="mode">モード選択</h3>
            <button onclick="startWithMode(0)" class="btn" id="rulemode">対人戦:公式ルール</button>
            <button onclick="startWithMode(1)" class="btn" id="rulemode">コンピューター対戦:公式ルール</button>
            <button onclick="startWithMode(2)" class="btn" id="rulemode">対人戦:ランダム配置</button>
            <button onclick="startWithMode(3)" class="btn" id="rulemode">コンピューター対戦:ランダム配置</button>
            <button onclick="startWithMode(4)" class="btn" id="onlineModeButton">オンライン対戦:公式配置</button>
            <button id = "cansel"onclick="closePanel()" class="btn">キャンセル</button>
        </div>
    </div>
    <div id="onlinePanel" class="panel" hidden="true">
        <div class="panelContent">
            <h3 class="mode">オンライン対戦</h3>
            <button id="createOnlineRoom" class="btn">部屋を作る</button>
            <label for="onlineRoomCode">相手の部屋コード</label>
            <input id="onlineRoomCode" class="onlineRoomCode" maxlength="6" autocomplete="off" placeholder="6文字のコード">
            <button id="joinOnlineRoom" class="btn">コードで参加</button>
            <p id="onlineStatus" role="status">Firebaseに接続しています…</p>
            <button id="closeOnlinePanel" class="btn">戻る</button>
        </div>
    </div>
    <div id="ruleOverlay" hidden>
        <div class="ruleBox">
            <button id="closeRule">✕</button>
            <div id="ruleContent"></div>
        </div>
    </div>
    <script src="move.js"></script>
    <script src="board.js"></script>
    <script src="moveGenerator.js"></script>
    <script src="valueModelData.js"></script>
    <script src="neuralEvaluator.js"></script>
    <script src="evaluate.js"></script>
    <script src="search.js"></script>
    <script src="ai.js"></script>
    <script src="index.js"></script>
    <script type="module" src="online.js"></script>
</body>
</html>
